name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # Reads the calculated values saved in the committed workbook. The LibreOffice
      # all-scenarios test skips itself when soffice is not installed.
      - name: Reconcile Python engine with the Excel model
        run: python scripts/reconcile_with_excel.py
